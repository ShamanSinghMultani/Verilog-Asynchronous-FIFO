name: Verilog CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  presignoff:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install tools (OSS CAD Suite - Yosys, Verilator, Icarus, Z3)
        uses: YosysHQ/setup-oss-cad-suite@v3

      - name: Prepare output folders
        run: mkdir -p reports/lint reports/cdc reports/formal reports/synthesis artifacts/formal artifacts/netlist

      - name: Simulation (self-checking testbench)
        run: |
          iverilog -g2012 -Wall -o fifo_tb fifo.v tb_fifo.v
          vvp ./fifo_tb | tee sim.log
          grep -q "TEST PASSED" sim.log

      - name: Lint (Verilator)
        run: verilator --lint-only -Wall fifo.v 2>&1 | tee reports/lint/verilator_rtl.txt

      - name: CDC review
        run: python3 scripts/run_cdc_review.py --rtl fifo.v --out reports/cdc/cdc_review.md

      - name: Formal - prepare models (Yosys)
        run: |
          yosys -l reports/formal/yosys_formal_bmc.log -s formal/fifo_formal.ys
          yosys -l reports/formal/yosys_formal_induction.log -s formal/fifo_formal_induction.ys

      - name: Formal - bounded model check
        run: yosys-smtbmc -s z3 --presat -t 18 artifacts/formal/fifo_formal.smt2 | tee reports/formal/bmc.log

      - name: Formal - induction
        run: yosys-smtbmc -s z3 --presat -i -t 18 artifacts/formal/fifo_formal_induction.smt2 | tee reports/formal/prove.log

      - name: Formal - cover
        run: yosys-smtbmc -s z3 -c -t 24 artifacts/formal/fifo_formal.smt2 | tee reports/formal/cover.log

      - name: Synthesis - generic (Yosys)
        run: yosys -l reports/synthesis/generic.log -s synthesis/generic.ys

      - name: Synthesis - Xilinx 7-series out-of-context (Yosys)
        run: yosys -l reports/synthesis/xc7_ooc.log -s synthesis/xc7_ooc.ys

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presignoff-reports
          path: |
            reports/
            artifacts/formal/*.smt2
            artifacts/netlist/
